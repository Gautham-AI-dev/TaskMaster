name: Backend policy tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test routing invariants
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
